# Dependabot: one summary pull request per ecosystem, once a month.
# The same settings run in every parisek/* package (issue in each repository).
# - monthly: fewer, larger updates cost less review than weekly single ones;
# - minor and patch in one group, majors in another. A major never rides with
#   the safe updates; review it alone and split it if it breaks;
# - cooldown: a release must be 7 days old (majors 30) before Dependabot
#   offers it. A compromised release is usually pulled within days.
#
# Security updates are not limited by the schedule or the cooldown. They need
# "Dependabot security updates" on in the repository settings; the `*-security`
# groups bundle them per ecosystem.
#
# Auto-merge: .github/workflows/dependabot-merge.yml squash-merges a pull
# request when every update is minor or patch, it touches only dev
# dependencies or action pins, and every check is green. Everything else
# waits for the owner's review; green CI is not enough there.
#
# Titles start with `chore(deps)` so that the `pr-title` check passes.
# Assignee: every entry assigns `parisek`, as AGENTS.md requires.
# Exception to the draft rule: Dependabot cannot open draft pull requests. Its pull requests open ready.
#
# Versioning: package.json pins exact versions. Dependabot keeps the pins and rewrites them
# to the new exact version. `versioning-strategy` stays at its default for that reason.
#
# Peer ranges: Dependabot may or may not change peerDependencies. Check the diff of every
# Dependabot pull request for peer ranges. Keep the @playwright/test, axe-core and lighthouse
# ranges in step with the exact dev pins.
version: 2
updates:
  # Root package: the engine. `dependencies` (pixelmatch, pngjs) ship to users.
  #
  # Playwright bump checklist. `@playwright/test` has its own pull request (excluded from the groups):
  #   1. docs/rc-trial.md: the install line `npm install -D @playwright/test@<version>`.
  #   2. .github/workflows/ci.yml: check that the install step `npx playwright install --with-deps chromium` still works.
  #   3. package.json `peerDependencies`: the range `>=1.49` stays unless the new version needs a higher floor.
  #   4. Run `npm test` and the integration tests that capture a page.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    assignees: [parisek]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@playwright/test"]
      npm-major:
        update-types: [major]
        exclude-patterns: ["@playwright/test"]

  # Viewer source: Vue, Vite, Tailwind, Vitest. It has its own lockfile.
  # DO NOT auto-merge a pull request for this folder. `viewer/` holds the compiled output.
  # A bump changes nothing shipped until someone runs `npm run build:viewer` and commits `viewer/`.
  # Review the pull request, rebuild the viewer on its branch and let `npm run check:viewer` pass.
  # Vue and Tailwind are bundled into `viewer/`. Check THIRD_PARTY_NOTICES.txt after a bump of a bundled package.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    assignees: [parisek]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    assignees: [parisek]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
