# Dependabot reports outdated dependencies and opens one pull request for each update.
# Titles start with `chore(deps)` so that the `pr-title` check passes.
#
# Versioning: package.json pins exact versions. Dependabot keeps the pins and rewrites them
# to the new exact version. `versioning-strategy` stays at its default for that reason.
# Dependabot does not edit `peerDependencies`. Check them by hand (see the Playwright note).
version: 2
updates:
  # Root package: the engine. `dependencies` ship to users (pixelmatch, pngjs).
  # A change there also needs a look at THIRD_PARTY_NOTICES.txt.
  #
  # Playwright bump checklist. `@playwright/test` has its own pull request (excluded from the group):
  #   1. docs/rc-trial.md: the install line `npm install -D @playwright/test@<version>`.
  #   2. .github/workflows/ci.yml: the browser install step `npx playwright install`.
  #   3. package.json `peerDependencies`: the range `>=1.49` stays unless the new version needs a higher floor.
  #   4. Run `npm test` and the integration tests that capture a page.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@playwright/test"

  # Viewer source: Vue, Vite, Tailwind, Vitest. It has its own lockfile.
  # DO NOT auto-merge a pull request for this folder. `viewer/` holds the compiled output.
  # A bump changes nothing shipped until someone runs `npm run build:viewer` and commits `viewer/`.
  # Review the pull request, rebuild the viewer on its branch and let `npm run check:viewer` pass.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
