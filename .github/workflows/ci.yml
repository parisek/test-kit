name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: package.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - run: npm test

      - name: The command line starts
        run: node bin/cli.js --help

  browser:
    name: Local screenshot pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run test:viewer
      - run: npm run check:viewer
      - run: npx playwright install --with-deps chromium
      - run: node tests/integration/check-example-site.mjs
      - run: node tests/integration/check-capture-guards.mjs
      - run: node tests/integration/check-pipeline.mjs
      - run: node tests/integration/check-viewer.mjs
      - run: node tests/integration/check-viewer-package.mjs
