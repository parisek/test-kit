name: Release

on:
  push:
    # Stable tags and release candidate tags only (R13.45). A dev tag
    # (vX.Y.Z-dev.N) starts no run (R13.26).
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate the immutable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const TAG = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))(-rc\.[1-9]\d*)?$/;
          const match = TAG.exec(tag);
          if (!match) throw new Error('Use a vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N tag.');
          if (match[1] !== pkg.version) throw new Error('The tag does not equal package.json version.');
          if (pkg.private !== true || pkg.license !== 'MIT') throw new Error('The package must stay private and use MIT.');
          JS
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - run: npm ci
      - run: npm test

      - name: Extract exact changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).slice(1);
          const matches = sections.filter((section) => section.split('\n')[0].startsWith(`[${version}] - `));
          if (matches.length !== 1) throw new Error('Expected one matching changelog section.');
          const notes = matches[0].slice(matches[0].indexOf('\n') + 1).trim();
          if (!notes || !notes.split('\n').some((line) => line.trim() && !line.startsWith('#'))) throw new Error('Release notes are empty.');
          writeFileSync('notes.md', `${notes}\n`);
          JS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "${RELEASE_TAG}" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "${RELEASE_TAG}" --verify-tag --title "${RELEASE_TAG}" --notes-file notes.md "${flags[@]}"
