name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate the immutable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw new Error('Use a stable vMAJOR.MINOR.PATCH tag.');
          if (tag !== `v${pkg.version}`) throw new Error('The tag does not equal package.json version.');
          if (pkg.private !== true || pkg.license !== 'MIT') throw new Error('The package must stay private and use MIT.');
          JS
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - run: npm ci
      - run: npm test

      - name: Extract exact changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).slice(1);
          const matches = sections.filter((section) => section.split('\n')[0].startsWith(`[${version}] - `));
          if (matches.length !== 1) throw new Error('Expected one matching changelog section.');
          const notes = matches[0].slice(matches[0].indexOf('\n') + 1).trim();
          if (!notes || !notes.split('\n').some((line) => line.trim() && !line.startsWith('#'))) throw new Error('Release notes are empty.');
          writeFileSync('notes.md', `${notes}\n`);
          JS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "${RELEASE_TAG}" --verify-tag --title "${RELEASE_TAG}" --notes-file notes.md
