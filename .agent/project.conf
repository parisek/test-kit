# Project configuration of the process standard (docs/process.md, section 12).
# Parsed by scripts/process/project-config.sh, never sourced.

gate = npm test && bash scripts/process/test.sh
setup = npm ci --ignore-scripts --silent && npm --prefix frontend ci --ignore-scripts --silent
# A head that changes one of these gets the trusted setup at the owner's HEAD, then setup_untrusted (#408).
setup_inputs = package.json package-lock.json .npmrc frontend/package.json frontend/package-lock.json frontend/.npmrc
setup_untrusted = true
spec = docs/specification.md
design_files = PRODUCT.md DESIGN.md docs/viewer-workflow.md
interface_paths = frontend/ viewer/
roadmap_url = https://claude.ai/artifact/KjzjvefFQ4xwn7qpq1hyUq
