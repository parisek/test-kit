<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prohlížeč porovnání</title>
<!--
	The report viewer: one shell, several views over one report.json.

	Plain files on purpose, as report-viewer.html is: ES modules, no bundler, no dependencies. It needs a
	file server because fetch() and modules refuse file://. Run `python3 -m http.server` in this folder.

	  ?data=<url>   which report to read (default: data/report.json)
	  #cile #matice #nalezy   which view opens (the pair kind chooses a default)
	  data/index.json        optional list of reports for the in-page data-source select
	  [                      shows or hides the left panel (remembered in localStorage, key rv.rail)

	Layout of the source: README.md.
-->
<style>@layer tokens, base, shell, components, views;</style>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/steps.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<div class="app" id="app" data-rail="open">
	<header class="toolbar" id="toolbar"></header>
	<aside class="rail" id="rail" aria-label="Panel">
		<div class="rail-body" id="rail-body"></div>
		<div class="rail-foot" id="rail-foot"></div>
	</aside>
	<main class="main">
		<div class="view" id="view" tabindex="-1"></div>
	</main>
	<button class="rail-backdrop" id="rail-backdrop" type="button" tabindex="-1" aria-label="Zavřít panel"></button>
</div>
<div id="about"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
